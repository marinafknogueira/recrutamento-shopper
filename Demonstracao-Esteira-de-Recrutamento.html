<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Esteira de Recrutamento — Shopper | Gente & Gestão</title>
<style>
:root{
  --ink:#1c2521;
  --ink-soft:#47554d;
  --paper:#f6f4ee;
  --panel:#ffffff;
  --line:#dcd7c9;
  --moss:#2f5d4f;
  --moss-dark:#1f4438;
  --amber:#c17a2b;
  --rust:#a8442f;
  --slate:#3f5b7a;
  color-scheme:light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px;}

/* ---------- Tela de entrada: a esteira ---------- */
.gate{
  min-height:100vh;
  background:linear-gradient(165deg,var(--moss-dark) 0%,#2b5648 55%,#22483b 100%);
  color:#eef2ee;
  padding:56px 28px 72px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:44px;
}
.gate-head{max-width:660px;text-align:center;}
.gate-head h1{
  font-size:clamp(28px,4.2vw,42px);
  line-height:1.18;
  font-weight:600;
  margin:0 0 16px;
  letter-spacing:-0.015em;
}
.gate-head p{
  margin:0;
  color:#c8dbd1;
  font-size:16px;
  line-height:1.6;
  max-width:52ch;
  margin-inline:auto;
}
.belt{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:0;
  width:100%;
  max-width:960px;
  position:relative;
}
.belt::before{
  content:"";
  position:absolute;
  top:34px;
  left:12%;
  right:12%;
  height:2px;
  background:rgba(255,255,255,0.18);
}
.station{
  position:relative;
  background:none;
  border:none;
  color:inherit;
  text-align:center;
  padding:0 16px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.station-num{
  width:34px;height:34px;
  border-radius:50%;
  background:var(--paper);
  color:var(--moss-dark);
  display:grid;place-items:center;
  font-weight:700;
  font-size:15px;
  position:relative;
  z-index:1;
  transition:transform .16s ease;
}
.station:hover .station-num,.station:focus-visible .station-num{transform:scale(1.14);}
.station-role{
  display:block;
  font-size:13px;
  color:#a9c8ba;
  letter-spacing:.02em;
}
.station-name{display:block;font-size:19px;font-weight:600;line-height:1.3;}
.station-desc{
  display:block;
  font-size:13.5px;
  color:#c3d7cd;
  line-height:1.55;
  max-width:26ch;
}
.station-cta{
  margin-top:4px;
  font-size:13.5px;
  color:#eef2ee;
  border-bottom:1px solid rgba(238,242,238,.45);
  padding-bottom:2px;
}
.station:hover .station-cta{border-bottom-color:#eef2ee;}

.gate-admin{
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.05);
  color:inherit;
  border-radius:8px;
  padding:18px 26px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:18px;
  text-align:left;
  max-width:560px;
}
.gate-admin:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4);}
.gate-admin-text{display:block;}
.gate-admin-text strong{display:block;font-size:16px;font-weight:600;margin-bottom:3px;}
.gate-admin-text span{display:block;font-size:13.5px;color:#c3d7cd;line-height:1.5;}
.gate-note{
  font-size:12.5px;
  color:#9dbcae;
  max-width:60ch;
  text-align:center;
  line-height:1.6;
  margin:0;
}

/* ---------- Barra de demonstração ---------- */
.demobar{
  background:#2b2f2c;
  color:#e5eae7;
  padding:9px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  font-size:13px;
  border-bottom:2px solid var(--amber);
}
.demobar .tag{
  background:var(--amber);
  color:#241503;
  font-weight:700;
  padding:2px 8px;
  border-radius:3px;
  font-size:11.5px;
  letter-spacing:.02em;
}
.demobar label{display:flex;align-items:center;gap:7px;color:#b9c4be;}
.demobar select{
  background:#3a403c;color:#fff;border:1px solid #55605a;
  border-radius:4px;padding:5px 8px;font-size:13px;
}
.demobar .spacer{flex:1;}
.demobar button{
  background:none;border:1px solid #59635d;color:#cfd8d3;
  padding:5px 11px;border-radius:4px;font-size:12.5px;cursor:pointer;
}
.demobar button:hover{border-color:#fff;color:#fff;}

/* ---------- Estrutura ---------- */
.shell{display:grid;grid-template-columns:224px 1fr;min-height:calc(100vh - 40px);}
.sidebar{
  background:var(--ink);color:#e7ece9;padding:24px 18px;
  display:flex;flex-direction:column;gap:22px;
}
.sidebar-brand{font-weight:600;font-size:17px;line-height:1.3;}
.sidebar-who{font-size:12.5px;color:#9fb3a8;line-height:1.5;margin-top:6px;}
.sidebar-who b{color:#dfe7e3;font-weight:600;display:block;}
.nav-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;flex:1;}
.nav-item{padding:9px 12px;border-radius:4px;cursor:pointer;font-size:14px;color:#cfd8d2;}
.nav-item:hover{background:rgba(255,255,255,.07);}
.nav-item.active{background:var(--moss);color:#fff;font-weight:500;}
.exit-btn{
  background:none;border:1px solid rgba(255,255,255,.2);color:#cfd8d2;
  padding:8px 12px;border-radius:4px;cursor:pointer;font-size:13px;
}
.exit-btn:hover{border-color:#fff;color:#fff;}
.main{padding:30px 40px 60px;max-width:1080px;}

.page-title{font-size:23px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em;}
.page-sub{color:var(--ink-soft);margin:0 0 24px;font-size:14px;line-height:1.55;}

/* ---------- Resumo do funil ---------- */
.funnel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.funnel button{
  background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:9px 13px;cursor:pointer;text-align:left;line-height:1.25;
}
.funnel button:hover{border-color:var(--moss);}
.funnel button.on{border-color:var(--moss);background:#eaf1ec;}
.funnel .n{display:block;font-size:19px;font-weight:700;color:var(--moss-dark);}
.funnel .l{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:1px;}

/* ---------- Lista ---------- */
.job-list{display:flex;flex-direction:column;gap:10px;}
.job-card{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:15px 18px;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;gap:16px;text-align:left;width:100%;
}
.job-card:hover{border-color:var(--moss);}
.job-card > span:first-child{display:block;min-width:0;}
.job-card-title{display:block;font-weight:600;font-size:15px;line-height:1.35;}
.job-card-meta{display:block;font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
.badge{
  font-size:11.5px;padding:4px 9px;border-radius:3px;white-space:nowrap;
  border:1px solid transparent;font-weight:600;
}
.badge-rascunho{background:#ece8dc;color:#6b6350;}
.badge-aguardando_aprovacao_ceo{background:#fbe9d2;color:#8d580f;border-color:#ecd2a4;}
.badge-reprovada{background:#f6dcd6;color:var(--rust);border-color:#e9baae;}
.badge-aprovada_aguardando_priorizacao{background:#dde8f0;color:var(--slate);border-color:#c3d5e4;}
.badge-em_recrutamento{background:#dcebe3;color:var(--moss-dark);border-color:#b9d8c6;}
.badge-preenchida{background:var(--moss);color:#fff;}
.badge-encerrada{background:#dcd7c9;color:var(--ink-soft);}
.prio{font-size:11.5px;padding:3px 8px;border-radius:3px;border:1px solid var(--line);color:var(--ink-soft);}
.prio-Alta{border-color:#e9baae;color:var(--rust);background:#fcefeb;}
.empty-state{
  border:1px dashed var(--line);border-radius:6px;padding:38px 24px;
  text-align:center;color:var(--ink-soft);line-height:1.6;
}

/* ---------- Formulários ---------- */
.form-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;
}
.form-field{display:flex;flex-direction:column;gap:6px;}
.form-field.full{grid-column:1/-1;}
label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
input,select,textarea{
  font-family:inherit;font-size:14px;padding:9px 10px;
  border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);
}
textarea{resize:vertical;min-height:74px;line-height:1.5;}
.form-actions{grid-column:1/-1;display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;}
button.primary{background:var(--moss);color:#fff;border:none;padding:10px 18px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;}
button.primary:hover{background:var(--moss-dark);}
button.secondary{background:none;border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:4px;font-size:14px;cursor:pointer;}
button.secondary:hover{border-color:var(--ink);}
button.danger{background:none;border:1px solid var(--rust);color:var(--rust);padding:10px 18px;border-radius:4px;font-size:14px;cursor:pointer;}
button.danger:hover{background:var(--rust);color:#fff;}
.error-msg{color:var(--rust);font-size:13.5px;grid-column:1/-1;}

/* ---------- Detalhe ---------- */
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:16px;}
.detail-panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 24px;margin-bottom:18px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 24px;margin:0;}
.detail-item dt{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:3px;}
.detail-item dd{margin:0;font-size:14px;white-space:pre-wrap;line-height:1.55;}
.detail-item.full{grid-column:1/-1;}
.reproval{background:#fcefeb;border:1px solid #e9baae;border-radius:5px;padding:12px 14px;margin-bottom:18px;font-size:13.5px;line-height:1.55;}
.reproval b{color:var(--rust);}
.history-item{border-left:2px solid var(--line);padding:2px 0 15px 16px;position:relative;font-size:13.5px;line-height:1.5;}
.history-item:last-child{padding-bottom:0;}
.history-item::before{content:"";position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--moss);}
.history-when{color:var(--ink-soft);font-size:11.5px;margin-bottom:1px;}
.back-link{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:0;margin-bottom:14px;}
.back-link:hover{color:var(--ink);text-decoration:underline;}
.section-title{font-size:16px;font-weight:600;margin:26px 0 12px;}

/* ---------- Usuários ---------- */
.users-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.users-table th,.users-table td{text-align:left;padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--line);}
.users-table tr:last-child td{border-bottom:none;}
.users-table th{color:var(--ink-soft);font-weight:600;font-size:12px;}
.pill-select{padding:5px 8px;font-size:13px;}
.mini{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:4px 10px;border-radius:4px;font-size:12.5px;cursor:pointer;}
.mini:hover{border-color:var(--rust);color:var(--rust);}

.toast{
  position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:5px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;
}
.toast.error{background:var(--rust);}

/* ---------- Pontuação ---------- */
.score-cards{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:26px;}
.score-card{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:20px 22px;flex:1 1 260px;min-width:240px;
}
.score-card h3{margin:0 0 4px;font-size:13px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.score-card .big{font-size:30px;font-weight:700;color:var(--moss-dark);line-height:1.15;}
.score-card .big small{font-size:15px;font-weight:600;color:var(--ink-soft);}
.score-bar-track{background:#eae6d8;border-radius:20px;height:12px;overflow:hidden;margin-top:12px;}
.score-bar-fill{background:var(--moss);height:100%;border-radius:20px;transition:width .3s ease;}
.score-bar-fill.over{background:var(--amber);}
.score-meta{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
.score-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.score-table th,.score-table td{text-align:left;padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--line);}
.score-table tr:last-child td{border-bottom:none;}
.score-table th{color:var(--ink-soft);font-weight:600;font-size:12px;}
.score-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
.score-rank{display:inline-block;width:22px;color:var(--ink-soft);font-size:12.5px;}
.score-points-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
.score-points-table th,.score-points-table td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;}
.score-points-table th{color:var(--ink-soft);font-weight:600;font-size:11.5px;}
details.score-ref{margin-top:26px;}
details.score-ref summary{cursor:pointer;font-size:13.5px;color:var(--ink-soft);}
details.score-ref summary:hover{color:var(--ink);}

@media (max-width:820px){
  .belt{grid-template-columns:1fr;gap:26px;}
  .belt::before{display:none;}
  .shell{grid-template-columns:1fr;}
  .sidebar{flex-direction:row;align-items:center;flex-wrap:wrap;gap:12px;}
  .nav-list{flex-direction:row;flex-wrap:wrap;}
  .main{padding:22px 18px 50px;}
  .form-grid,.detail-grid{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== SHOPPER VISUAL REFRESH — somente interface ===== */
:root{
  --ink:#17172f;
  --ink-soft:#596273;
  --paper:#f6f8f7;
  --panel:#ffffff;
  --line:#e4e8e6;
  --moss:#22ad78;
  --moss-dark:#16865d;
  --amber:#f2b84b;
  --rust:#d45b54;
  --slate:#536b8a;
  --shopper-navy:#201e3d;
  --shopper-green:#27b37e;
  --shopper-green-2:#4cc993;
  color-scheme:light;
}
body{
  font-family:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  background:var(--paper);
  color:var(--ink);
}
button,input,select,textarea{font-family:inherit;}
:focus-visible{outline:3px solid rgba(39,179,126,.35);outline-offset:2px;}

/* Entrada */
.gate{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,rgba(76,201,147,.18),transparent 28%),
    radial-gradient(circle at 92% 86%,rgba(39,179,126,.16),transparent 26%),
    var(--shopper-navy);
  padding:48px 28px 64px;
  gap:34px;
}
.gate-head{max-width:760px;}
.gate-head h1{font-size:clamp(30px,4.1vw,44px);font-weight:700;letter-spacing:-.03em;margin:8px 0 14px;}
.gate-head p{color:#cbd0df;font-size:16px;max-width:58ch;}
.shopper-lockup{display:inline-flex;align-items:center;gap:11px;margin-bottom:4px;}
.shopper-mark{width:46px;height:46px;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.16));}
.shopper-wordmark{font-weight:800;font-size:28px;letter-spacing:-.055em;color:#fff;line-height:1;}
.shopper-wordmark small{display:block;font-size:10px;font-weight:600;letter-spacing:.02em;color:#9fe2c6;margin-top:4px;}
.belt{max-width:1020px;gap:14px;}
.belt::before{background:rgba(255,255,255,.13);left:15%;right:15%;}
.station{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:24px 18px 22px;min-height:245px;transition:transform .18s ease,background .18s ease,border-color .18s ease;}
.station:hover{background:rgba(255,255,255,.10);border-color:rgba(76,201,147,.55);transform:translateY(-4px);}
.station-num{width:38px;height:38px;background:#fff;color:var(--shopper-navy);}
.station-role{color:#78d6b0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
.station-name{font-size:20px;}
.station-desc{color:#c5ccda;}
.station-cta{color:#8fe0be;border-bottom-color:rgba(143,224,190,.35);font-weight:600;}
.gate-admin{border-radius:16px;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);max-width:640px;}
.gate-admin:hover{background:rgba(255,255,255,.11);border-color:rgba(76,201,147,.5);}
.gate-note{color:#9da6ba;}

/* Barra superior */
.demobar{
  background:#fff;color:var(--ink);padding:12px 24px;border-bottom:1px solid var(--line);
  box-shadow:0 2px 12px rgba(23,23,47,.04);font-size:13px;
}
.demobar .tag{background:#e8f8f1;color:#147a55;border-radius:999px;padding:5px 10px;font-size:11px;}
.demobar label{color:var(--ink-soft);}
.demobar select{background:#f7faf9;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px;}
.demobar button{border:1px solid var(--line);color:var(--ink-soft);border-radius:9px;padding:7px 11px;background:#fff;}
.demobar button:hover{border-color:#b8d9cb;color:var(--moss-dark);}

/* Estrutura */
.shell{grid-template-columns:252px 1fr;min-height:calc(100vh - 49px);}
.sidebar{background:var(--shopper-navy);color:#eef1f7;padding:22px 16px 18px;gap:24px;box-shadow:5px 0 24px rgba(23,23,47,.06);}
.sidebar-brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;}
.sidebar-brand .shopper-mark{width:36px;height:36px;}
.sidebar-brand::before,.sidebar-brand::after{display:none;}
.sidebar-brand::after{content:"⌣";position:absolute;margin-left:8px;margin-top:0;color:#fff;font-size:22px;font-weight:700;}
.sidebar-who{color:#aeb5c6;margin-top:10px;padding-left:44px;}
.sidebar-who b{color:#fff;}
.nav-list{gap:6px;}
.nav-item{padding:11px 13px;border-radius:11px;color:#bfc5d3;font-size:13.5px;transition:all .16s ease;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:var(--shopper-green);color:#fff;font-weight:700;box-shadow:0 7px 18px rgba(39,179,126,.20);}
.exit-btn{border-color:rgba(255,255,255,.14);border-radius:10px;color:#c5cad6;}
.exit-btn:hover{border-color:#5bd3a2;color:#fff;background:rgba(255,255,255,.05);}
.main{padding:34px 44px 64px;max-width:1240px;width:100%;}
.page-title{font-size:28px;font-weight:750;letter-spacing:-.03em;}
.page-sub{font-size:14px;color:#687385;margin-bottom:28px;}

/* Componentes */
.funnel{gap:10px;margin-bottom:26px;}
.funnel button{border-radius:13px;padding:12px 15px;background:#fff;box-shadow:0 2px 8px rgba(23,23,47,.03);}
.funnel button.on{border-color:#8adbbd;background:#edfaf5;}
.funnel .n{color:var(--moss-dark);font-size:21px;}
.job-list{gap:12px;}
.job-card{border-radius:15px;padding:17px 19px;box-shadow:0 2px 9px rgba(23,23,47,.035);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;}
.job-card:hover{border-color:#9bdcc3;box-shadow:0 8px 22px rgba(23,23,47,.07);transform:translateY(-1px);}
.job-card-title{font-size:15.5px;}
.badge{border-radius:999px;padding:5px 10px;}
.form-grid,.detail-panel,.score-card,.users-table,.score-table{border-radius:15px;box-shadow:0 2px 10px rgba(23,23,47,.035);}
.form-grid{padding:27px;}
input,select,textarea{border-radius:9px;border-color:#dce3df;padding:10px 11px;}
input:focus,select:focus,textarea:focus{border-color:#76d2ad;box-shadow:0 0 0 3px rgba(39,179,126,.10);outline:none;}
button.primary{background:var(--shopper-green);border-radius:10px;padding:11px 19px;font-weight:700;box-shadow:0 6px 15px rgba(39,179,126,.18);}
button.primary:hover{background:var(--moss-dark);}
button.secondary,button.danger{border-radius:10px;}
.detail-panel{padding:24px 26px;}

function pontosPorVaga(job){
  var tabela = (job.setor === "Tecnologia") ? PONTOS_TECNOLOGIA : PONTOS_OUTRAS_AREAS;
  var base = tabela[job.senioridade];
  if(base === undefined) base = 6;
  return base * (job.quantidade_vagas || 1);
}
function vagasPontuaveis(){
  return db.jobs.filter(function(j){ return j.status === "preenchida"; });
}
function pontuacaoPorPessoa(){
  var mapa = {};
  vagasPontuaveis().forEach(function(j){
    var resp = j.responsavel_talentos;
    if(!resp) return;
    mapa[resp] = (mapa[resp] || 0) + pontosPorVaga(j);
  });
  return mapa;
}
function pontuacaoEquipe(){
  var mapa = pontuacaoPorPessoa();
  var total = 0;
  for(var k in mapa) total += mapa[k];
  return total;
}

/* ---------------------- Armazenamento ---------------------- */
var db = { jobs:[], users:[], nextId:9 };

function load(){
  try{
    var raw = window.localStorage.getItem(STORE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && parsed.jobs && parsed.users){ db = parsed; return; }
    }
  }catch(e){ /* navegador sem armazenamento: segue com os exemplos */ }
  reset(false);
}
function save(){
  try{ window.localStorage.setItem(STORE_KEY, JSON.stringify(db)); }catch(e){}
}
function reset(persist){
  db = { jobs: seedJobs(), users: seedUsers(), nextId: 9 };
  if(persist !== false) save();
}

/* ---------------------- Estado da tela ---------------------- */
var state = { user:null, view:"list", selectedId:null, filter:null, editing:false };
var app = document.getElementById("app");

function userByEmail(email){
  for(var i=0;i<db.users.length;i++){ if(db.users[i].email === email) return db.users[i]; }
  return null;
}
function nomeDe(email){
  var u = userByEmail(email);
  return u ? u.nome : email;
}
function jobById(id){
  for(var i=0;i<db.jobs.length;i++){ if(db.jobs[i].id === id) return db.jobs[i]; }
  return null;
}
function agora(){ return new Date().toISOString().slice(0,19); }
function dataBr(s){
  var d = new Date(s);
  if(isNaN(d)) return s;
  return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function esc(s){
  if(s === undefined || s === null) return "";
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function toast(msg, isError){
  var el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3400);
}
function log(job, status, comentario){
  job.history.push({ em: agora(), para: status, por: state.user.email, comentario: comentario || null });
}

/* ---------------------- Estrutura logada ---------------------- */
function visibleJobs(){
  var r = state.user.role, me = state.user.email;
  var out = db.jobs.filter(function(j){
    if(r === "admin" || r === "ceo") return true;
    if(r === "gestor") return j.gestor_email === me;
    if(r === "talentos") return j.status !== "rascunho";
    return false;
  });
  return out.slice().sort(function(a,b){
    var ta = a.history.length ? a.history[a.history.length-1].em : a.criada_em;
    var tb = b.history.length ? b.history[b.history.length-1].em : b.criada_em;
    return tb < ta ? -1 : (tb > ta ? 1 : 0);
  });
}

function navItems(){
  var items = [{ key:"list", label:"Vagas" }];
  if(state.user.role === "gestor" || state.user.role === "admin") items.push({ key:"new", label:"Nova vaga" });
  if(state.user.role === "talentos" || state.user.role === "admin") items.push({ key:"score", label:"Pontuação" });
  if(state.user.role === "admin") items.push({ key:"users", label:"Usuários" });

}

  for(var i=0;i<navs.length;i++){

      function go(){ state.view = el.getAttribute("data-nav"); state.selectedId = null; state.editing = false; render(); }

    })(navs[i]);

              (j.prioridade ? '<span class="prio prio-'+esc(j.prioridade)+'">'+esc(j.prioridade)+'</span>' : '') +

function renderForm(main, job){
  var editando = !!job;
  main.innerHTML = '' +
    (editando ? '<button class="back-link" id="back-btn">← Voltar para a vaga</button>' : '') +
    '<h1 class="page-title">'+(editando ? "Editar vaga" : "Nova vaga")+'</h1>' +
    '<p class="page-sub">Todos os campos são obrigatórios. Enquanto estiver como rascunho, ninguém além de você vê esta vaga.</p>' +
    '<form id="job-form" class="form-grid">' + campos(job) +
      '<div class="error-msg" id="form-error"></div>' +
      '<div class="form-actions">' +
        '<button type="submit" class="primary">'+(editando ? "Salvar alterações" : "Salvar rascunho")+'</button>' +
        '<button type="button" class="secondary" id="cancel-btn">Cancelar</button>' +
      '</div>' +
    '</form>';

  if(editando){
    document.getElementById("back-btn").addEventListener("click", function(){ state.editing = false; render(); });
  }
  document.getElementById("cancel-btn").addEventListener("click", function(){
    if(editando){ state.editing = false; } else { state.view = "list"; }
    render();
  });
  document.getElementById("job-form").addEventListener("submit", function(e){
    e.preventDefault();
    var fd = new FormData(e.target);
    var body = {};
    fd.forEach(function(v,k){ body[k] = v; });
    body.quantidade_vagas = parseInt(body.quantidade_vagas,10) || 1;
    if(!body.gestor_email) body.gestor_email = editando ? job.gestor_email : state.user.email;

    if(editando){
      for(var k in body) job[k] = body[k];
      save();
      toast("Alterações salvas.");
      state.editing = false;
    }else{
      var novo = v(body);
      novo.id = db.nextId++;
      novo.status = "rascunho";
      novo.criada_em = agora();
      novo.history = [{ em: agora(), para:"rascunho", por: state.user.email, comentario:"Vaga criada" }];
      db.jobs.push(novo);
      save();
      toast("Vaga salva como rascunho.");
      state.selectedId = novo.id;
      state.view = "detail";
    }
    render();
  });
}

/* ---------------------- Detalhe ---------------------- */
function item(label, valor, full){
  return '<div class="detail-item'+(full?" full":"")+'"><dt>'+esc(label)+'</dt><dd>'+esc(valor === null || valor === undefined || valor === "" ? "—" : valor)+'</dd></div>';
}

function renderDetail(main){
  var job = jobById(state.selectedId);
  if(!job){ state.view = "list"; render(); return; }
  if(state.editing){ renderForm(main, job); return; }

  var r = state.user.role, me = state.user.email;
  var dono = (r === "gestor" && job.gestor_email === me);
  var podeEditar   = (r === "admin") || (dono && (job.status === "rascunho" || job.status === "reprovada"));
  var podeEnviar   = (r === "admin" || dono) && (job.status === "rascunho" || job.status === "reprovada");
  var podeDecidir  = (r === "admin" || r === "ceo") && job.status === "aguardando_aprovacao_ceo";
  var podePriorizar= (r === "admin" || r === "talentos") && job.status === "aprovada_aguardando_priorizacao";
  var podeFechar   = (r === "admin" || r === "talentos") && job.status === "em_recrutamento";

  main.innerHTML = '' +
    '<button class="back-link" id="back-btn">← Voltar para a lista</button>' +
    '<div class="detail-header">' +
      '<div>' +
        '<h1 class="page-title">'+esc(job.cargo)+' — '+esc(job.senioridade)+'</h1>' +
        '<p class="page-sub" style="margin-bottom:0;">Aberta por '+esc(nomeDe(job.gestor_email))+' em '+esc(dataBr(job.criada_em))+'</p>' +
      '</div>' +
      '<span class="badge badge-'+job.status+'">'+esc(STATUS_LABEL[job.status])+'</span>' +
    '</div>' +
    (job.status === "reprovada" && job.motivo_reprovacao
      ? '<div class="reproval"><b>Reprovada pelo CEO.</b> '+esc(job.motivo_reprovacao)+'</div>' : '') +
    '<div class="detail-panel"><dl class="detail-grid">' +
      item("Setor", job.setor) +
      item("Centro de custo", job.centro_custo) +
      item("Unidade", job.unidade) +
      item("Reporte direto", job.reporte_direto) +
      item("Tipo de vaga", job.tipo_vaga === "aumento_quadro" ? "Aumento de quadro" : "Substituição") +
      item("Recrutamento", job.recrutamento === "interno" ? "Interno" : "Externo") +
      item("Quantidade de vagas", job.quantidade_vagas) +
      item("Faixa salarial", job.faixa_salarial) +
      (job.prioridade ? item("Prioridade", job.prioridade) : "") +
      (job.responsavel_talentos ? item("Responsável em Talentos", nomeDe(job.responsavel_talentos)) : "") +
      item("Requisitos", job.requisitos, true) +
      item("Responsabilidades", job.responsabilidades, true) +
      item("Pergunta de entrevista 1", job.pergunta_entrevista_1, true) +
      item("Pergunta de entrevista 2", job.pergunta_entrevista_2, true) +
      item("Pergunta de entrevista 3", job.pergunta_entrevista_3, true) +
    '</dl></div>' +
    '<div class="detail-panel" id="acoes"></div>' +
    '<h2 class="section-title">Histórico</h2>' +
    '<div class="detail-panel">' +
      job.history.slice().reverse().map(function(h){
        return '<div class="history-item">' +
          '<div class="history-when">'+esc(dataBr(h.em))+'</div>' +
          '<div><strong>'+esc(STATUS_LABEL[h.para] || h.para)+'</strong> — '+esc(nomeDe(h.por)) +
          (h.comentario ? '<br />'+esc(h.comentario) : '') + '</div>' +
        '</div>';
      }).join("") +
    '</div>';

  document.getElementById("back-btn").addEventListener("click", function(){
    state.view = "list"; state.selectedId = null; render();
  });

  var acoes = [];
  if(podeEditar)    acoes.push('<button class="secondary" id="a-edit">Editar vaga</button>');
  if(podeEnviar)    acoes.push('<button class="primary" id="a-send">Enviar para aprovação do CEO</button>');
  if(podeDecidir){  acoes.push('<button class="primary" id="a-ok">Aprovar vaga</button>');
                    acoes.push('<button class="danger" id="a-no">Reprovar vaga</button>'); }
  if(podePriorizar) acoes.push('<button class="primary" id="a-prio">Definir prioridade e responsável</button>');
  if(podeFechar){   acoes.push('<button class="primary" id="a-fill">Marcar como preenchida</button>');
                    acoes.push('<button class="secondary" id="a-close">Encerrar vaga</button>'); }

  var painel = document.getElementById("acoes");
  painel.innerHTML = acoes.length
    ? '<div class="form-actions" style="margin-top:0;">'+acoes.join("")+'</div><div id="inline"></div>'
    : '<p class="page-sub" style="margin:0;">Nesta etapa a vaga está com outra pessoa. Você acompanha, mas não há ação sua pendente.</p>';

  function aplica(novoStatus, comentario, antes){
    if(antes) antes();
    job.status = novoStatus;
    log(job, novoStatus, comentario);
    save();
    render();
  }

  if(podeEditar) document.getElementById("a-edit").addEventListener("click", function(){ state.editing = true; render(); });

  if(podeEnviar) document.getElementById("a-send").addEventListener("click", function(){
    aplica("aguardando_aprovacao_ceo","Enviada para aprovação do CEO", function(){ job.motivo_reprovacao = null; });
    toast("Vaga enviada para aprovação do CEO.");
  });

  if(podeDecidir){
    document.getElementById("a-ok").addEventListener("click", function(){
      aplica("aprovada_aguardando_priorizacao","Aprovada pelo CEO");
      toast("Vaga aprovada. Seguiu para o time de Talentos.");
    });
    document.getElementById("a-no").addEventListener("click", function(){
      document.getElementById("inline").innerHTML =
        '<div class="form-field full" style="margin-top:16px;">' +
          '<label>Motivo da reprovação (o gestor vai ler isto)</label>' +
          '<textarea id="motivo"></textarea>' +
          '<button class="danger" style="margin-top:10px;width:fit-content;" id="motivo-ok">Confirmar reprovação</button>' +
        '</div>';
      document.getElementById("motivo").focus();
      document.getElementById("motivo-ok").addEventListener("click", function(){
        var m = document.getElementById("motivo").value.trim();
        if(!m){ toast("Escreva o motivo antes de reprovar.", true); return; }
        job.motivo_reprovacao = m;
        aplica("reprovada", m);
        toast("Vaga reprovada e devolvida ao gestor.");
      });
    });
  }

  if(podePriorizar){
    document.getElementById("a-prio").addEventListener("click", function(){
      var talentos = db.users.filter(function(u){ return u.role === "talentos"; });
      document.getElementById("inline").innerHTML =
        '<div class="form-grid" style="margin-top:16px;padding:0;border:none;background:none;">' +
          '<div class="form-field"><label>Prioridade</label><select id="p-prio"><option>Alta</option><option selected>Média</option><option>Baixa</option></select></div>' +
          '<div class="form-field"><label>Responsável em Talentos</label><select id="p-resp">' +
            talentos.map(function(t){ return '<option value="'+esc(t.email)+'">'+esc(t.nome)+'</option>'; }).join("") +
          '</select></div>' +
          '<div class="form-actions"><button class="primary" id="p-ok">Iniciar recrutamento</button></div>' +
        '</div>';
      document.getElementById("p-ok").addEventListener("click", function(){
        var prio = document.getElementById("p-prio").value;
        var resp = document.getElementById("p-resp").value;
        job.prioridade = prio;
        job.responsavel_talentos = resp;
        aplica("em_recrutamento","Prioridade: "+prio+". Responsável: "+nomeDe(resp));
        toast("Recrutamento iniciado.");
      });
    });
  }

  if(podeFechar){
    document.getElementById("a-fill").addEventListener("click", function(){
      aplica("preenchida","Vaga preenchida");
      toast("Vaga marcada como preenchida.");
    });
    document.getElementById("a-close").addEventListener("click", function(){
      aplica("encerrada","Vaga encerrada sem contratação");
      toast("Vaga encerrada.");
    });
  }
}

/* ---------------------- Pontuação ---------------------- */
function renderScore(main){
  var r = state.user.role, me = state.user.email;
  var mapaPontos = pontuacaoPorPessoa();
  var totalEquipe = pontuacaoEquipe();
  var pctEquipe = Math.min(100, Math.round((totalEquipe / META_EQUIPE_SEMESTRE) * 100));
  var meuPontos = mapaPontos[me] || 0;

  var html = '' +
    '<h1 class="page-title">Pontuação de contratações</h1>' +
    '<p class="page-sub">Cada vaga preenchida soma pontos conforme o cargo contratado. Meta da equipe: '+META_EQUIPE_SEMESTRE+' pontos por semestre.</p>' +
    '<div class="score-cards">' +
      '<div class="score-card">' +
        '<h3>Equipe — total do semestre</h3>' +
        '<div class="big">'+totalEquipe+' <small>/ '+META_EQUIPE_SEMESTRE+' pts</small></div>' +
        '<div class="score-bar-track"><div class="score-bar-fill'+(pctEquipe>=100?" over":"")+'" style="width:'+pctEquipe+'%;"></div></div>' +
        '<div class="score-meta">'+pctEquipe+'% da meta semestral da equipe</div>' +
      '</div>';

  if(r === "talentos"){
    html += '' +
      '<div class="score-card">' +
        '<h3>Sua pontuação</h3>' +
        '<div class="big">'+meuPontos+' <small>pts</small></div>' +
        '<div class="score-meta">Meta individual: a definir por senioridade. Visível só para você e para o Admin (Gente e Gestão).</div>' +
      '</div>';
  }
  html += '</div>';

  if(r === "admin"){
    var talentos = db.users.filter(function(u){ return u.role === "talentos"; });
    var linhas = talentos.map(function(u){ return { u:u, pts: mapaPontos[u.email] || 0 }; })
      .sort(function(a,b){ return b.pts - a.pts; });
    html += '' +
      '<h2 class="section-title">Pontuação por pessoa</h2>' +
      '<p class="page-sub" style="margin-top:-6px;">Esta tabela só aparece para o Admin. Cada pessoa de Talentos vê apenas a própria pontuação.</p>' +
      '<table class="score-table"><thead><tr><th></th><th>Pessoa</th><th>Cargo</th><th style="text-align:right;">Pontos no semestre</th></tr></thead><tbody>' +
        linhas.map(function(l,i){
          return '<tr><td class="score-rank">'+(i+1)+'º</td><td>'+esc(l.u.nome)+'</td><td>'+esc(l.u.cargo||"")+'</td><td class="num">'+l.pts+'</td></tr>';
        }).join("") +
      '</tbody></table>';
  }

  html += '' +
    '<details class="score-ref">' +
      '<summary>Ver tabela de pontos por cargo contratado</summary>' +
      '<table class="score-points-table"><thead><tr><th>Senioridade</th><th>Outras áreas</th><th>Tecnologia</th></tr></thead><tbody>' +
        SENIORIDADES.filter(function(s){ return PONTOS_OUTRAS_AREAS[s] !== undefined; }).map(function(s){
          return '<tr><td>'+esc(s)+'</td><td>'+PONTOS_OUTRAS_AREAS[s]+'</td><td>'+PONTOS_TECNOLOGIA[s]+'</td></tr>';
        }).join("") +
      '</tbody></table>' +
    '</details>';

  main.innerHTML = html;
}

/* ---------------------- Usuários ---------------------- */
function renderUsers(main){
  main.innerHTML = '' +
    '<h1 class="page-title">Usuários</h1>' +
    '<p class="page-sub">Só o Admin abre esta tela. Quem não estiver nesta lista não consegue entrar no sistema, mesmo tendo o link.</p>' +
    '<form id="add-user" class="form-grid" style="margin-bottom:22px;">' +
      '<div class="form-field"><label>Nome</label><input name="nome" required placeholder="Nome completo" /></div>' +
      '<div class="form-field"><label>E-mail corporativo</label><input name="email" type="email" required placeholder="pessoa@shopper.com.br" /></div>' +
      '<div class="form-field"><label>Cargo</label><input name="cargo" placeholder="ex: Gerente de Suprimentos" /></div>' +
      '<div class="form-field"><label>Nível de acesso</label><select name="role">' +
        '<option value="gestor">Gestor</option><option value="ceo">CEO</option>' +
        '<option value="talentos">Talentos</option><option value="admin">Admin</option>' +
      '</select></div>' +
      '<div class="form-actions"><button type="submit" class="primary">Liberar acesso</button></div>' +
    '</form>' +
    '<table class="users-table"><thead><tr><th>Nome</th><th>E-mail</th><th>Nível de acesso</th><th></th></tr></thead><tbody>' +
      db.users.map(function(u){
        return '<tr>' +
          '<td>'+esc(u.nome)+'<div style="color:var(--ink-soft);font-size:12px;">'+esc(u.cargo||"")+'</div></td>' +
          '<td>'+esc(u.email)+'</td>' +
          '<td><select class="pill-select" data-role-for="'+esc(u.email)+'">' +
            ["admin","ceo","gestor","talentos"].map(function(x){
              return '<option value="'+x+'"'+(u.role===x?" selected":"")+'>'+ROLE_LABEL[x]+'</option>';
            }).join("") +
          '</select></td>' +
          '<td>'+(u.email === state.user.email ? '<span style="color:var(--ink-soft);font-size:12.5px;">você</span>' : '<button class="mini" data-del="'+esc(u.email)+'">Remover</button>')+'</td>' +
        '</tr>';
      }).join("") +
    '</tbody></table>';

  document.getElementById("add-user").addEventListener("submit", function(e){
    e.preventDefault();
    var fd = new FormData(e.target), o = {};
    fd.forEach(function(v,k){ o[k] = v; });
    if(userByEmail(o.email)){ toast("Esse e-mail já tem acesso.", true); return; }
    db.users.push({ email:o.email, nome:o.nome, cargo:o.cargo||"", role:o.role });
    save();
    render();
    toast("Acesso liberado para "+o.nome+".");
  });

  var sels = main.querySelectorAll("[data-role-for]");
  for(var i=0;i<sels.length;i++){
    sels[i].addEventListener("change", function(){
      var u = userByEmail(this.getAttribute("data-role-for"));
      u.role = this.value;
      save();
      if(u.email === state.user.email){ state.user = u; }
      render();
      toast("Nível de "+u.nome+" alterado para "+ROLE_LABEL[u.role]+".");
    });
  }
  var dels = main.querySelectorAll("[data-del]");
  for(var k=0;k<dels.length;k++){
    dels[k].addEventListener("click", function(){
      var email = this.getAttribute("data-del");
      db.users = db.users.filter(function(u){ return u.email !== email; });
      save();
      render();
      toast("Acesso removido.");
    });
  }
}

/* ---------------------- Início ---------------------- */
load();
render();
</script>
</body>
</html>
